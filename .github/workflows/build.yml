name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q maya-app.zip -d maya
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true
      - run: gradle assembleDebug --no-daemon
        working-directory: maya/maya-app
      - uses: actions/upload-artifact@v4
        with:
          name: Maya-APK
          path: maya/maya-app/app/build/outputs/apk/debug/*.apk
